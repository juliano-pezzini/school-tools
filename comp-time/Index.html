<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e3347'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='2'/%3E%3Cpolyline points='16,9 16,16 20.5,20.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Banco de Horas — Ferramentas Escolares</title>
  <style>
    :root {
      --bg:      oklch(96.5% 0.006 256);
      --surface: #ffffff;
      --fg:      oklch(17%   0.02  258);
      --muted:   oklch(48%   0.015 258);
      --border:  oklch(88%   0.008 256);
      --brand:   oklch(26%   0.035 258);
      --accent:  oklch(58%   0.155 201);
      --accent-bg: oklch(94% 0.04  201);
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .page-header {
      background: var(--brand);
      background-image: repeating-linear-gradient(
        transparent, transparent 27px,
        rgba(255,255,255,0.06) 27px, rgba(255,255,255,0.06) 28px
      );
      padding: 18px 20px 16px;
    }
    .page-header-label {
      font-size: .68rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 4px;
    }
    .page-header h1 {
      font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em;
      margin: 0; color: #fff;
    }
    .page-body {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 70px); padding: 2rem;
    }
    .placeholder { text-align: center; max-width: 340px; }
    .placeholder-icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
      background: var(--accent-bg); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .placeholder-icon svg { color: var(--accent); }
    .placeholder h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
    .placeholder p { font-size: .9rem; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-label">Ferramentas Escolares</div>
    <h1>Banco de Horas</h1>
  </header>
  <div class="page-body">
    <div class="placeholder">
      <div class="placeholder-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <h2>Em construção</h2>
      <p>O controle de banco de horas estará disponível em breve.</p>
    </div>
  </div>

  <!-- Badge de versão (troubleshooting) -->
  <div id="version-badge" aria-hidden="true"></div>
  <style>
    #version-badge{position:fixed;right:6px;bottom:5px;z-index:2147483000;
      font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8f98;
      opacity:.6;pointer-events:none;-webkit-user-select:none;user-select:none}
  </style>
  <script>
    (function(){
      var APP_VERSION = '__APP_VERSION__'; // substituído por sed no deploy
      function versionLabel_(raw){
        if(raw==null) return 'dev';
        var s=String(raw).trim();
        if(s===''||s.charAt(0)==='_') return 'dev';
        return s.charAt(0).toLowerCase()==='v'?s:'v'+s;
      }
      var el=document.getElementById('version-badge');
      if(el) el.textContent=versionLabel_(APP_VERSION);
    })();
  </script>
</body>
</html>
