<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scanner — Ensina Blumenau</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f4f6f8;
        color: #1a1a1a;
      }
      h1 { font-size: 1.2rem; margin: 0 0 12px; }
      #video {
        width: 100%;
        max-height: 60vh;
        border-radius: 12px;
        background: #000;
        object-fit: cover;
      }
      .status { padding: 12px; border-radius: 8px; margin-top: 12px; font-weight: 600; background: #fff; }
      .ok { background: #e6f4ea; color: #137333; }
      .err { background: #fce8e6; color: #c5221f; }
      #resultado { margin-top: 14px; }
      .code {
        font-size: 1.3rem;
        font-weight: 700;
        word-break: break-all;
        background: #fff;
        padding: 14px;
        border-radius: 10px;
      }
      button {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        background: #1565c0;
        color: #fff;
        margin-top: 10px;
        cursor: pointer;
      }
      button.sec { background: #e0e0e0; color: #1a1a1a; }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <h1>Scanner — Ensina Blumenau</h1>

    <video id="video" playsinline muted autoplay></video>
    <div class="status" id="status">Iniciando camera…</div>
    <button id="lanterna" class="sec" hidden>Lanterna</button>
    <p id="dica" style="font-size: 0.85rem; color: #666; margin: 8px 0 0;">
      Segure firme a ~15–25 cm do codigo, com boa luz. Deixe o codigo preencher a largura da tela e espere a imagem ficar nitida.
    </p>

    <div id="resultado" hidden>
      <div class="code" id="code"></div>
      <button id="enviar">Enviar para o app</button>
      <button id="copiar" class="sec">Copiar codigo</button>
      <button id="denovo" class="sec">Escanear outro</button>
    </div>

    <!-- ZXing entra so como fallback quando o BarcodeDetector nativo nao existe. -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script>
      // ?return=<URL do /exec do Apps Script> — para onde devolver o codigo lido.
      var params = new URLSearchParams(location.search);
      var returnUrl = params.get('return');

      var FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'itf', 'qr_code'];
      var video = document.getElementById('video');
      var parado = false;
      var stream = null;
      var track = null;

      // Confirmacao anti-erro: so aceita um codigo apos 2 leituras IGUAIS seguidas.
      // Codigo de barras borrado gera falso positivo (valores diferentes) — isso filtra.
      var ultimo = null, repeticoes = 0;

      function setStatus(msg, cls) {
        var s = document.getElementById('status');
        s.textContent = msg;
        s.className = 'status' + (cls ? ' ' + cls : '');
      }

      // Abre a camera EU MESMO (em vez de deixar a lib abrir) — assim controlo foco
      // continuo e lanterna de forma confiavel no track real.
      async function abrirCamera() {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        });
        video.srcObject = stream;
        await video.play();
        track = stream.getVideoTracks()[0];
        ajustarCamera();
        // A capability `torch` em alguns Samsung so e' reportada um tempo depois
        // de iniciar — tentamos algumas vezes antes de desistir.
        var tentativas = 0;
        var t = setInterval(function () {
          tentativas++;
          ajustarCamera();
          if (!document.getElementById('lanterna').hidden) {
            clearInterval(t);
          } else if (tentativas >= 6) {
            clearInterval(t);
            // Capability nunca reportada: mostra o botao mesmo assim — no S24+ o
            // acionamento direto via applyConstraints costuma funcionar.
            prepararLanterna();
          }
        }, 600);
      }

      function ajustarCamera() {
        if (!track || !track.getCapabilities) return;
        var caps = track.getCapabilities();
        if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        }
        if (caps.torch) prepararLanterna();
      }

      var torchOn = false;
      function prepararLanterna() {
        var btn = document.getElementById('lanterna');
        if (!btn.hidden) return;
        btn.hidden = false;
        btn.textContent = 'Lanterna';
        btn.onclick = function () {
          if (!track) return;
          torchOn = !torchOn;
          track.applyConstraints({ advanced: [{ torch: torchOn }] })
            .then(function () {
              btn.textContent = torchOn ? 'Apagar lanterna' : 'Lanterna';
            })
            .catch(function () {
              torchOn = false;
              btn.textContent = 'Lanterna (nao suportada neste navegador)';
            });
        };
      }
      function esconderLanterna() {
        var btn = document.getElementById('lanterna');
        btn.hidden = true;
        torchOn = false;
      }

      // Recebe um candidato; so confirma apos 2 leituras identicas seguidas.
      function candidato(code, formato) {
        if (parado) return;
        if (code === ultimo) {
          repeticoes++;
        } else {
          ultimo = code;
          repeticoes = 1;
        }
        if (repeticoes >= 2) aceitar(code, formato);
      }

      function aceitar(code, formato) {
        parado = true;
        pararCamera();
        mostrar(code, formato);
      }

      function pararCamera() {
        try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        stream = null;
        track = null;
        esconderLanterna();
      }

      // --- Motor 1 (preferido): BarcodeDetector nativo do Android/Chrome ---
      async function loopNativo(detector) {
        if (parado) return;
        try {
          var codes = await detector.detect(video);
          if (codes && codes.length) candidato(codes[0].rawValue, codes[0].format);
        } catch (e) { /* quadro sem leitura — normal */ }
        if (!parado) requestAnimationFrame(function () { loopNativo(detector); });
      }

      // --- Motor 2 (fallback): ZXing sobre o stream que EU abri ---
      function iniciarZXing() {
        var hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF,
          ZXing.BarcodeFormat.QR_CODE,
        ]);
        var reader = new ZXing.BrowserMultiFormatReader(hints);
        reader.decodeFromStream(stream, video, function (result) {
          if (result && !parado) candidato(result.getText(), result.getBarcodeFormat());
        }).catch(function (e) {
          setStatus('Erro no leitor: ' + (e && e.message ? e.message : e), 'err');
        });
      }

      async function iniciar() {
        parado = false;
        ultimo = null;
        repeticoes = 0;
        document.getElementById('resultado').hidden = true;
        setStatus('Aponte a camera para o codigo de barras ou QR…');
        try {
          await abrirCamera();
        } catch (e) {
          setStatus('Erro ao abrir a camera: ' + (e && e.message ? e.message : e), 'err');
          return;
        }
        if ('BarcodeDetector' in window) {
          var suportados = [];
          try { suportados = await window.BarcodeDetector.getSupportedFormats(); } catch (e) {}
          var fmts = FORMATOS.filter(function (f) { return suportados.indexOf(f) >= 0; });
          var detector = new window.BarcodeDetector(fmts.length ? { formats: fmts } : undefined);
          loopNativo(detector);
        } else {
          iniciarZXing();
        }
      }

      function mostrar(code, formato) {
        document.getElementById('code').textContent = code;
        document.getElementById('resultado').hidden = false;
        setStatus('Codigo lido (formato ' + formato + ')!', 'ok');
        if (navigator.vibrate) navigator.vibrate(120);

        document.getElementById('enviar').onclick = function () {
          if (!returnUrl) {
            alert('Sem URL de retorno. Abra esta pagina com ?return=<URL do app>.');
            return;
          }
          var sep = returnUrl.indexOf('?') >= 0 ? '&' : '?';
          location.href = returnUrl + sep + 'code=' + encodeURIComponent(code);
        };
        document.getElementById('copiar').onclick = function () {
          if (navigator.clipboard) navigator.clipboard.writeText(code);
        };
        document.getElementById('denovo').onclick = iniciar;
      }

      iniciar();
    </script>
  </body>
</html>
