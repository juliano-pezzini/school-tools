<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scanner — Ensina Blumenau</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f4f6f8;
        color: #1a1a1a;
      }
      h1 { font-size: 1.2rem; margin: 0 0 12px; }
      #video {
        width: 100%;
        max-height: 60vh;
        border-radius: 12px;
        background: #000;
        object-fit: cover;
      }
      .status { padding: 12px; border-radius: 8px; margin-top: 12px; font-weight: 600; background: #fff; }
      .ok { background: #e6f4ea; color: #137333; }
      .err { background: #fce8e6; color: #c5221f; }
      #resultado { margin-top: 14px; }
      .code {
        font-size: 1.3rem;
        font-weight: 700;
        word-break: break-all;
        background: #fff;
        padding: 14px;
        border-radius: 10px;
      }
      button {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        background: #1565c0;
        color: #fff;
        margin-top: 10px;
        cursor: pointer;
      }
      button.sec { background: #e0e0e0; color: #1a1a1a; }
      button:active { opacity: 0.85; }
      .zoom { display: none; align-items: center; gap: 10px; margin-top: 8px; }
      .zoom button { width: 48px; margin: 0; font-size: 1.3rem; padding: 8px 0; }
      .zoom .val { font-weight: 700; min-width: 52px; text-align: center; }
      .hint2 { font-size: 0.8rem; color: #888; margin: 6px 0 0; }
    </style>
  </head>
  <body>
    <h1>Scanner — Ensina Blumenau</h1>

    <video id="video" playsinline muted autoplay></video>
    <div class="status" id="status">Iniciando camera…</div>
    <div class="zoom" id="zoom">
      <button id="zoomMenos" type="button">−</button>
      <span class="val" id="zoomVal">1.0×</span>
      <button id="zoomMais" type="button">+</button>
    </div>
    <p class="hint2">QR pequeno: aumente o zoom. Codigo de barras largo da NFe: deixe no 1× e aproxime ate preencher a largura.</p>
    <button id="lanterna" class="sec" hidden>Lanterna</button>
    <p id="dica" style="font-size: 0.85rem; color: #666; margin: 8px 0 0;">
      Segure firme a ~15–25 cm do codigo, com boa luz. Deixe o codigo preencher a largura da tela e espere a imagem ficar nitida.
    </p>

    <div id="resultado" hidden>
      <div class="code" id="code"></div>
      <button id="enviar">Enviar para o app</button>
      <button id="copiar" class="sec">Copiar codigo</button>
      <button id="denovo" class="sec">Escanear outro</button>
    </div>

    <!-- ZXing entra so como fallback quando o BarcodeDetector nativo nao existe. -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script>
      // Parametros de URL
      var params = new URLSearchParams(location.search);
      var returnUrl = params.get('return');
      var MODE = params.get('mode'); // 'nfe' = novo fluxo de extracao
      var PROXY_PADRAO = 'https://script.google.com/macros/s/AKfycbyTh-HYAiSLVhDV633FE7gGrB6pXjC8MsktztvSG09ZtvWV7_ieBHQ6DCxcl3dWvpIgsQ/exec';
      var PROXY_URL = params.get('proxy') || PROXY_PADRAO;

      var UF = {
        11:'RO',12:'AC',13:'AM',14:'RR',15:'PA',16:'AP',17:'TO',21:'MA',22:'PI',23:'CE',
        24:'RN',25:'PB',26:'PE',27:'AL',28:'SE',29:'BA',31:'MG',32:'ES',33:'RJ',35:'SP',
        41:'PR',42:'SC',43:'RS',50:'MS',51:'MT',52:'GO',53:'DF'
      };

      var FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'itf', 'qr_code'];
      var video = document.getElementById('video');
      var parado = false;
      var stream = null;
      var track = null;
      var focoTimer = null;
      var zoomAtual = 1, zoomCaps = null;

      // Confirmacao anti-erro: so aceita um codigo apos 2 leituras IGUAIS seguidas.
      var ultimo = null, repeticoes = 0;

      function setStatus(msg, cls) {
        var s = document.getElementById('status');
        s.textContent = msg;
        s.className = 'status' + (cls ? ' ' + cls : '');
      }

      // ==================== Camera ====================
      async function abrirCamera() {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        });
        video.srcObject = stream;
        await video.play();
        track = stream.getVideoTracks()[0];
        ajustarCamera();
        prepararZoom();
        // Reaplica foco continuo durante TODA a sessao de leitura — alguns Samsung
        // perdem o lock de autofoco e precisam ser "cutucados" de novo.
        if (focoTimer) clearInterval(focoTimer);
        focoTimer = setInterval(ajustarCamera, 1200);
        var tentativas = 0;
        var t = setInterval(function () {
          tentativas++;
          ajustarCamera();
          if (!document.getElementById('lanterna').hidden) {
            clearInterval(t);
          } else if (tentativas >= 6) {
            clearInterval(t);
            prepararLanterna();
          }
        }, 600);
      }

      function ajustarCamera() {
        if (!track || !track.getCapabilities) return;
        var caps = track.getCapabilities();
        if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        }
        if (caps.torch) prepararLanterna();
      }

      // Zoom: muitos Android expoem `zoom` nas capabilities do track.
      function prepararZoom() {
        if (!track || !track.getCapabilities) return;
        var caps = track.getCapabilities();
        if (!caps.zoom) return; // sem zoom optico/digital exposto
        zoomCaps = caps.zoom; // {min, max, step}
        document.getElementById('zoom').style.display = 'flex';
        // comeca em 1x (ou no minimo, se o minimo for > 1)
        aplicarZoom(Math.max(1, zoomCaps.min));
      }
      function aplicarZoom(z) {
        if (!track || !zoomCaps) return;
        z = Math.min(zoomCaps.max, Math.max(zoomCaps.min, z));
        zoomAtual = z;
        track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () {});
        document.getElementById('zoomVal').textContent = z.toFixed(1) + '×';
      }
      function passoZoom() { return zoomCaps && zoomCaps.step ? Math.max(zoomCaps.step, 0.5) : 0.5; }

      // Toque na imagem reforca o foco (foco unico e volta ao continuo).
      function focarNoToque() {
        if (!track || !track.getCapabilities) return;
        var caps = track.getCapabilities();
        if (!caps.focusMode) return;
        var seq = [];
        if (caps.focusMode.indexOf('single-shot') >= 0) seq.push('single-shot');
        if (caps.focusMode.indexOf('continuous') >= 0) seq.push('continuous');
        if (!seq.length) return;
        track.applyConstraints({ advanced: [{ focusMode: seq[0] }] }).catch(function () {});
        if (seq[1]) setTimeout(function () {
          track.applyConstraints({ advanced: [{ focusMode: seq[1] }] }).catch(function () {});
        }, 800);
      }

      var torchOn = false;
      function prepararLanterna() {
        var btn = document.getElementById('lanterna');
        if (!btn.hidden) return;
        btn.hidden = false;
        btn.textContent = 'Lanterna';
        btn.onclick = function () {
          if (!track) return;
          torchOn = !torchOn;
          track.applyConstraints({ advanced: [{ torch: torchOn }] })
            .then(function () {
              btn.textContent = torchOn ? 'Apagar lanterna' : 'Lanterna';
            })
            .catch(function () {
              torchOn = false;
              btn.textContent = 'Lanterna (nao suportada neste navegador)';
            });
        };
      }
      function esconderLanterna() {
        var btn = document.getElementById('lanterna');
        btn.hidden = true;
        torchOn = false;
      }

      function pararCamera() {
        if (focoTimer) { clearInterval(focoTimer); focoTimer = null; }
        try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        stream = null;
        track = null;
        esconderLanterna();
        document.getElementById('zoom').style.display = 'none';
        zoomCaps = null;
      }

      // ==================== Leitura (BarcodeDetector + ZXing) ====================
      function candidato(code) {
        if (parado) return;
        if (code === ultimo) {
          repeticoes++;
        } else {
          ultimo = code;
          repeticoes = 1;
        }
        if (repeticoes >= 2) aceitar(code);
      }

      function aceitar(code) {
        if (MODE === 'nfe') {
          processarNfe(code);
        } else {
          parado = true;
          pararCamera();
          mostrarLegado(code);
        }
      }

      // --- Motor 1: BarcodeDetector nativo ---
      async function loopNativo(detector) {
        if (parado) return;
        try {
          var codes = await detector.detect(video);
          if (codes && codes.length) candidato(codes[0].rawValue);
        } catch (e) {}
        if (!parado) requestAnimationFrame(function () { loopNativo(detector); });
      }

      // --- Motor 2: ZXing fallback ---
      function iniciarZXing() {
        var hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF,
          ZXing.BarcodeFormat.QR_CODE,
        ]);
        var reader = new ZXing.BrowserMultiFormatReader(hints);
        reader.decodeFromStream(stream, video, function (result) {
          if (result && !parado) candidato(result.getText());
        }).catch(function (e) {
          setStatus('Erro no leitor: ' + (e && e.message ? e.message : e), 'err');
        });
      }

      async function iniciar() {
        parado = false;
        ultimo = null;
        repeticoes = 0;
        document.getElementById('resultado').hidden = true;
        setStatus('Aponte a camera para o codigo de barras ou QR…');
        try {
          await abrirCamera();
        } catch (e) {
          setStatus('Erro ao abrir a camera: ' + (e && e.message ? e.message : e), 'err');
          return;
        }
        if ('BarcodeDetector' in window) {
          var suportados = [];
          try { suportados = await window.BarcodeDetector.getSupportedFormats(); } catch (e) {}
          var fmts = FORMATOS.filter(function (f) { return suportados.indexOf(f) >= 0; });
          var detector = new window.BarcodeDetector(fmts.length ? { formats: fmts } : undefined);
          loopNativo(detector);
        } else {
          iniciarZXing();
        }
      }

      // ==================== Modo legado (sem ?mode=nfe) ====================
      function mostrarLegado(code) {
        document.getElementById('code').textContent = code;
        document.getElementById('resultado').hidden = false;
        setStatus('Codigo lido!', 'ok');
        if (navigator.vibrate) navigator.vibrate(120);

        document.getElementById('enviar').onclick = function () {
          if (!returnUrl) {
            alert('Sem URL de retorno. Abra esta pagina com ?return=<URL do app>.');
            return;
          }
          var sep = returnUrl.indexOf('?') >= 0 ? '&' : '?';
          location.href = returnUrl + sep + 'code=' + encodeURIComponent(code);
        };
        document.getElementById('copiar').onclick = function () {
          if (navigator.clipboard) navigator.clipboard.writeText(code);
        };
        document.getElementById('denovo').onclick = iniciar;
      }

      // ==================== Modo NFe (?mode=nfe) ====================

      // --- Utilidades ---
      function base64url(str) {
        return btoa(unescape(encodeURIComponent(str)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      function extrairChave(valor) {
        if (!valor) return null;
        var v = String(valor).trim();
        var m = v.match(/[?&]p=([^|&]+)/i);
        if (m) { var c = m[1].replace(/\D/g, ''); if (c.length >= 44) return c.slice(0, 44); }
        var d = v.replace(/\D/g, '');
        var m44 = d.match(/\d{44}/);
        return m44 ? m44[0] : null;
      }

      function dvChave(ch43) {
        var pesos = [2, 3, 4, 5, 6, 7, 8, 9], soma = 0, p = 0;
        for (var i = ch43.length - 1; i >= 0; i--) {
          soma += parseInt(ch43.charAt(i), 10) * pesos[p % 8];
          p++;
        }
        var dv = 11 - (soma % 11);
        return dv >= 10 ? 0 : dv;
      }

      function chaveValida(ch) {
        return /^\d{44}$/.test(ch) && dvChave(ch.slice(0, 43)) === parseInt(ch.charAt(43), 10);
      }

      function fmtCNPJ(c) {
        return c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
      }

      function decodeBase64Utf8(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }

      function txt(node, tag) {
        var el = node.getElementsByTagName(tag)[0];
        return el ? el.textContent : '';
      }

      function redirecionarComDados(scanData) {
        if (!returnUrl) {
          setStatus('Dados extraidos mas sem URL de retorno (?return=).', 'err');
          document.getElementById('code').textContent = JSON.stringify(scanData, null, 2);
          document.getElementById('resultado').hidden = false;
          return;
        }
        var sep = returnUrl.indexOf('?') >= 0 ? '&' : '?';
        location.href = returnUrl + sep + 'scanData=' + base64url(JSON.stringify(scanData));
      }

      // --- Fluxo NFe principal ---
      function processarNfe(code) {
        var ch = extrairChave(code);
        if (!ch) {
          // Nao e nota fiscal — ignorar silenciosamente, continuar escaneando
          return;
        }
        if (!chaveValida(ch)) {
          setStatus('Código inválido — escaneie novamente', 'err');
          ultimo = null;
          repeticoes = 0;
          return;
        }
        // Chave valida — parar scanner e processar
        parado = true;
        pararCamera();
        if (navigator.vibrate) navigator.vibrate(120);

        var modelo = ch.slice(20, 22);
        var cUF = ch.slice(0, 2);
        var sefazUrl = extrairSefazUrl(code);

        if (modelo === '55') {
          processarNFeModelo55(ch);
        } else if (modelo === '65') {
          processarNFCe(ch, cUF, sefazUrl);
        } else {
          fallbackBrasilAPI(ch, '');
        }
      }

      function extrairSefazUrl(code) {
        var v = String(code).trim();
        if (/^https?:\/\//i.test(v)) return v;
        return '';
      }

      // --- NFe modelo 55: proxy ---
      async function processarNFeModelo55(ch) {
        setStatus('Consultando nota fiscal…');
        try {
          var sep = PROXY_URL.indexOf('?') >= 0 ? '&' : '?';
          var url = PROXY_URL + sep + 'chave=' + encodeURIComponent(ch);
          var r = await fetch(url, { method: 'GET' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          var data = await r.json();
          if (!data.xml_base64) throw new Error('Sem XML na resposta');

          var xml = decodeBase64Utf8(data.xml_base64);
          var doc = new DOMParser().parseFromString(xml, 'application/xml');

          var emit = doc.getElementsByTagName('emit')[0];
          var fornecedor = emit ? txt(emit, 'xNome') : '';
          var ender = emit ? emit.getElementsByTagName('enderEmit')[0] : null;
          var cidade = ender ? txt(ender, 'xMun') : '';
          var uf = ender ? txt(ender, 'UF') : '';

          var dhEmi = txt(doc, 'dhEmi');
          var dataISO = dhEmi ? dhEmi.slice(0, 10) : '';

          var icmsTot = doc.getElementsByTagName('ICMSTot')[0];
          var valor = icmsTot ? parseFloat(txt(icmsTot, 'vNF')) : 0;
          if (isNaN(valor)) valor = 0;

          var dets = doc.getElementsByTagName('det');
          var itensArr = [];
          for (var i = 0; i < dets.length; i++) {
            var prod = dets[i].getElementsByTagName('prod')[0];
            if (!prod) continue;
            var nome = txt(prod, 'xProd');
            var q = txt(prod, 'qCom');
            itensArr.push(nome + ' (' + q + ')');
          }
          var itens = itensArr.join('; ');

          redirecionarComDados({
            fornecedor: fornecedor,
            cidade: cidade,
            uf: uf,
            data: dataISO,
            valor: valor,
            itens: itens,
            link: '',
            parcial: false
          });
        } catch (e) {
          fallbackBrasilAPI(ch, '');
        }
      }

      // --- NFC-e modelo 65: client-side SEFAZ fetch ---
      // QR code contains a URL like https://sat.sef.sc.gov.br/nfce/consulta?p=CHAVE|2|1|...
      // For SC (cUF=42) we attempt to fetch and parse the SEFAZ page directly.
      // Other states go straight to fallback (different HTML structures, Cloudflare, etc).
      async function processarNFCe(ch, cUF, sefazUrl) {
        if (cUF !== '42' || !sefazUrl) {
          fallbackBrasilAPI(ch, sefazUrl);
          return;
        }
        setStatus('Consultando SEFAZ-SC…');
        try {
          var controller = new AbortController();
          var timer = setTimeout(function () { controller.abort(); }, 10000);
          var r = await fetch(sefazUrl, { mode: 'cors', signal: controller.signal });
          clearTimeout(timer);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          var html = await r.text();
          // Cloudflare challenge detection: page has no fiscal data
          if (html.length < 500 || /challenge-platform|cf-browser-verification/i.test(html)) {
            throw new Error('Cloudflare challenge');
          }
          var parsed = parseSefazHtml(html);
          if (!parsed) throw new Error('Parse falhou');

          var ano = '20' + ch.slice(2, 4);
          var mes = ch.slice(4, 6);

          redirecionarComDados({
            fornecedor: parsed.fornecedor || '',
            cidade: parsed.cidade || '',
            uf: UF[parseInt(cUF, 10)] || '',
            data: parsed.data || (ano + '-' + mes + '-01'),
            valor: parsed.valor || 0,
            itens: parsed.itens || '',
            link: sefazUrl,
            parcial: false
          });
        } catch (e) {
          // Fetch failed (Cloudflare, timeout, CORS, network) — fallback with link
          fallbackBrasilAPI(ch, sefazUrl);
        }
      }

      // --- Parse SEFAZ-SC HTML (best-effort) ---
      // The SEFAZ-SC NFC-e page structure varies, so we try multiple selectors
      // and patterns. If we can't extract at least supplier OR total value, we
      // return null to trigger the fallback path.
      function parseSefazHtml(html) {
        try {
          var doc = new DOMParser().parseFromString(html, 'text/html');

          // Fornecedor: common selectors on SEFAZ-SC NFC-e page
          var fornecedor = '';
          var emitEl = doc.querySelector('.txtTit2, .NFCDetalhe_Emitente, #u20, .emit .xNome');
          if (emitEl) fornecedor = emitEl.textContent.trim();
          if (!fornecedor) {
            // Fallback: look for element near CNPJ mention
            var allEls = doc.querySelectorAll('div, span, td');
            for (var i = 0; i < allEls.length; i++) {
              var parent = allEls[i].parentElement;
              var ctx = parent ? parent.textContent : '';
              var t = allEls[i].textContent.trim();
              if (t.length > 5 && t.length < 100 && /CNPJ/.test(ctx)) {
                fornecedor = t;
                break;
              }
            }
          }

          // Valor total: try known selectors, then regex
          var valor = 0;
          var totalEl = doc.querySelector('.txtMax, .totalNumb, #linhaTotal .txtTit, .total .valor');
          if (totalEl) {
            var vt = totalEl.textContent.replace(/[^\d,.]/g, '').replace(/\./g, '').replace(',', '.');
            valor = parseFloat(vt) || 0;
          }
          if (!valor) {
            var bodyHtml = doc.body ? doc.body.innerHTML : html;
            var mTotal = bodyHtml.match(/[Vv]alor\s*[Tt]otal[^<]*?R?\$?\s*([\d.,]+)/);
            if (mTotal) {
              var vn = mTotal[1].replace(/\./g, '').replace(',', '.');
              valor = parseFloat(vn) || 0;
            }
          }

          // Data emissao (DD/MM/YYYY → YYYY-MM-DD)
          var data = '';
          var bodyText = doc.body ? doc.body.textContent : '';
          var mData = bodyText.match(/(\d{2})\/(\d{2})\/(\d{4})/);
          if (mData) data = mData[3] + '-' + mData[2] + '-' + mData[1];

          // Itens: try table rows and known item selectors
          var itens = '';
          var itemEls = doc.querySelectorAll('.txtTit, .NFCDetalhe_Item, .det .prod, tr.item, #tabResult tr');
          var itensArr = [];
          for (var j = 0; j < itemEls.length && itensArr.length < 30; j++) {
            var rt = itemEls[j].textContent.trim();
            if (rt.length > 3 && rt.length < 120 && /\d/.test(rt) && !/Total|CNPJ|Chave|Emiss/i.test(rt)) {
              itensArr.push(rt.replace(/\s+/g, ' '));
            }
          }
          if (itensArr.length > 0) itens = itensArr.slice(0, 20).join('; ');

          // Cidade: look for "City - SC" or "City/SC" pattern
          var cidade = '';
          var mCidade = bodyText.match(/([A-Z\u00C0-\u00FF][a-z\u00E0-\u00FF]+(?:\s+[A-Z\u00C0-\u00FF][a-z\u00E0-\u00FF]+)*)\s*[-\/]\s*SC/);
          if (mCidade) cidade = mCidade[1];

          if (!fornecedor && !valor) return null;
          return { fornecedor: fornecedor, cidade: cidade, data: data, valor: valor, itens: itens };
        } catch (e) {
          return null;
        }
      }

      // --- Fallback: decode key + BrasilAPI ---
      async function fallbackBrasilAPI(ch, link) {
        var cnpj = ch.slice(6, 20);
        var cUF = ch.slice(0, 2);
        var ano = '20' + ch.slice(2, 4);
        var mes = ch.slice(4, 6);

        setStatus('Obtendo dados do fornecedor…');
        var fornecedor = fmtCNPJ(cnpj);
        var cidade = '';
        var uf = UF[parseInt(cUF, 10)] || '';

        try {
          var r = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + cnpj);
          if (r.ok) {
            var d = await r.json();
            fornecedor = d.razao_social || d.nome_fantasia || fornecedor;
            cidade = d.municipio || '';
            if (d.uf) uf = d.uf;
          }
        } catch (e) {
          // BrasilAPI tambem falhou — usa CNPJ formatado como nome
        }

        redirecionarComDados({
          fornecedor: fornecedor,
          cidade: cidade,
          uf: uf,
          data: ano + '-' + mes + '-01',
          valor: 0,
          itens: '',
          link: link || '',
          parcial: true
        });
      }

      // ==================== Eventos de camera ====================
      document.getElementById('zoomMais').onclick = function () { aplicarZoom(zoomAtual + passoZoom()); };
      document.getElementById('zoomMenos').onclick = function () { aplicarZoom(zoomAtual - passoZoom()); };
      video.addEventListener('click', focarNoToque);

      // ==================== Inicio ====================
      iniciar();
    </script>
  </body>
</html>
