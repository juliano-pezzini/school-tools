<!DOCTYPE html>
<!--
  ===========================================================================
  SMOKE DE DEPLOY (checklist manual — o agente não consegue implantar)
  ===========================================================================
  Pré-requisito: `clasp push` + Implantar como Web App
  (Executar como: EU/implantador; Acesso: DOMÍNIO). Abrir a URL /exec.

  1.  Abrir o Web App: a 1ª execução cria a planilha "Fluxo de Caixa — APP (dados)"
      com as 5 abas (Lancamentos, Config, Fechamentos, Usuarios, Auditoria) e
      promove você a admin (bootstrap anti-lockout).
  2.  Painel "Saldo": deve sinalizar "abertura não definida" com link "Registrar agora".
  3.  Clicar "Registrar agora" → modal abre → preencher R$ 1.000,00 (data não-futura) →
      "Registrar" → saldo passa a R$ 1.000,00; botão ✏️ aparece ao lado de "Abertura".
  3b. Clicar ✏️ → modal abre pré-preenchido → editar valor → "Salvar" → saldo recalcula;
      Auditoria registra (editar, antes→depois). "Remover" → confirmação → abertura
      volta a indefinida + CTA reaparece; Auditoria registra (excluir).
  4.  Lançar ENTRADA R$ 200,00 e SAÍDA R$ 50,00 → lista mostra os dois; saldo
      R$ 1.150,00. Dar duplo-clique no "Adicionar" não cria duplicata (clientToken).
  5.  Editar a entrada (mudar valor) → saldo recalcula; conferir AlteradoPor/Em na
      aba Lancamentos e um registro novo na aba Auditoria (ação=editar).
  6.  Excluir (soft-delete) a saída → some da lista, saldo ajusta; aba Lancamentos
      mostra Excluido=true + ExcluidoPor/Em; aba Auditoria registra (excluir).
  7.  Fechar o mês corrente → tentar lançar/editar com data nesse mês é bloqueado
      ("período MM/AAAA está fechado"); fechar de novo só avisa "já fechado".
  8.  Reabrir o mês → lançar/editar volta a funcionar; aba Fechamentos preserva o
      registro de fechamento + ReabertoPor/Em.
  9.  Testar categoria: usar "Doação", depois digitar "do" em novo lançamento e ver
      a sugestão única no autocomplete.
  10. Conferir saldo negativo (forçar saída > saldo) → exibido em vermelho, sem
      bloquear. Conferir as 5 abas e linhas na Auditoria.
  ===========================================================================
-->
<html lang="pt-BR">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317a99b'/%3E%3Crect x='4' y='8' width='24' height='16' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cline x1='4' y1='14' x2='28' y2='14' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ── DESIGN SYSTEM — Ferramentas Escolares ─────────────────────────── */
      :root {
        --bg:        oklch(96.5% 0.006 256);
        --surface:   #ffffff;
        --muted-bg:  oklch(92%   0.006 256);
        --fg:        oklch(17%   0.02  258);
        --muted:     oklch(48%   0.015 258);
        --border:    oklch(88%   0.008 256);
        --brand:     oklch(26%   0.035 258);
        --brand-md:  oklch(38%   0.04  258);
        --brand-lt:  oklch(58%   0.03  258);
        --accent:    oklch(58%   0.155 201);
        --accent-h:  oklch(52%   0.155 201);
        --accent-bg: oklch(94%   0.04  201);
        --ok:        oklch(52%   0.14  155);
        --ok-bg:     oklch(95%   0.04  155);
        --ok-dk:     oklch(35%   0.12  155);
        --err:       oklch(52%   0.18   25);
        --err-bg:    oklch(96%   0.04   25);
        --err-dk:    oklch(38%   0.16   25);
        --warn:      oklch(65%   0.14   78);
        --warn-bg:   oklch(97%   0.04   78);
        --warn-bdr:  oklch(80%   0.10   78);
        --warn-dk:   oklch(42%   0.12   78);
        --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 0; padding: 0;
        background: var(--bg); color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      /* ── Page header ── */
      .page-header {
        background: var(--brand);
        background-image: repeating-linear-gradient(
          transparent, transparent 27px,
          rgba(255,255,255,0.06) 27px, rgba(255,255,255,0.06) 28px
        );
        padding: 18px 20px 16px;
        color: #fff;
      }
      .page-header-inner { max-width: 920px; margin: 0 auto; }
      .page-header-label {
        font-size: .68rem; font-weight: 600; letter-spacing: 0.1em;
        text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 4px;
      }
      .page-header h1 {
        font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em;
        margin: 0 0 2px; color: #fff;
      }
      .page-header p { font-size: .82rem; color: rgba(255,255,255,.65); margin: 0; }
      /* ── Content wrapper ── */
      .page-body { max-width: 920px; margin: 0 auto; padding: 16px; }
      h2 { font-size: 1rem; font-weight: 600; margin: 2px 0 12px; letter-spacing: -0.01em; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .card {
        background: var(--surface); border-radius: var(--r-lg);
        border: 1px solid var(--border);
        padding: 16px; margin-bottom: 14px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
      }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
      .grow { flex: 1; min-width: 130px; }
      label {
        font-size: .68rem; color: var(--muted); text-transform: uppercase;
        letter-spacing: .08em; font-weight: 600; display: block; margin-bottom: 4px;
      }
      input, select, textarea {
        padding: 10px 12px; font-size: .95rem; border-radius: var(--r-md);
        border: 1px solid var(--border); background: var(--surface);
        font-family: inherit; width: 100%; color: var(--fg);
        transition: border-color .15s, box-shadow .15s;
      }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-bg);
      }
      textarea { resize: vertical; min-height: 42px; }
      button {
        padding: 10px 12px; font-size: .95rem; border-radius: var(--r-md);
        border: 0; background: var(--accent); color: #fff;
        font-weight: 600; cursor: pointer; width: auto; font-family: inherit;
        transition: background .15s;
      }
      button:hover  { background: var(--accent-h); }
      button:active { background: var(--accent-h); }
      button.danger    { background: var(--err);      color: var(--surface); }
      button.danger:hover { background: var(--err-dk); }
      button.secondary { background: var(--brand-md); color: #fff; }
      button.secondary:hover { background: var(--brand); }
      button.ghost { background: var(--muted-bg); color: var(--fg); }
      button.ghost:hover { background: var(--border); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .saldo-num { font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .saldo-num.neg { color: var(--err-dk); }
      .totais { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
      .totais div b { font-variant-numeric: tabular-nums; }
      .warn {
        background: var(--warn-bg); border: 1px solid var(--warn-bdr);
        color: var(--warn-dk); padding: 10px 12px;
        border-radius: var(--r-md); margin-top: 10px; font-size: .9rem;
      }
      table { width: 100%; border-collapse: collapse; font-size: .86rem; margin-top: 10px; }
      th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; }
      th { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .tag { font-size: .68rem; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
      .tag.entrada { background: var(--ok-bg);  color: var(--ok-dk); }
      .tag.saida   { background: var(--err-bg); color: var(--err-dk); }
      .result { padding: 10px 12px; border-radius: var(--r-md); margin-top: 10px; font-size: .88rem; font-weight: 600; }
      .ok  { background: var(--ok-bg);  color: var(--ok-dk); }
      .err { background: var(--err-bg); color: var(--err-dk); }
      .hidden { display: none; }
      .actions button { padding: 5px 9px; font-size: .8rem; margin-right: 4px; }
      .field { margin-bottom: 8px; }
      .pill {
        display: inline-block; font-size: .7rem; font-weight: 700;
        padding: 3px 10px; border-radius: 999px;
        background: var(--accent-bg); color: var(--accent);
        letter-spacing: 0.02em;
      }
      /* modal */
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .modal-backdrop.hidden { display: none; }
      .modal {
        background: var(--surface); border-radius: var(--r-lg);
        border: 1px solid var(--border);
        padding: 20px; width: 92%; max-width: 440px;
        box-shadow: 0 8px 30px rgba(0,0,0,.18);
      }
      .modal h2 { margin: 0 0 14px; font-size: 1.05rem; }
      .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
      .edit-pen { background: none; border: none; cursor: pointer; padding: 2px 6px; font-size: .95rem; width: auto; color: var(--accent); vertical-align: middle; }
      /* month bar */
      .month-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      .month-bar .month-nav { display: flex; align-items: center; gap: 6px; }
      .month-bar .month-nav input { width: 110px; text-align: center; }
      .month-bar .month-nav button { padding: 8px 10px; font-size: .85rem; }
      .month-bar .fech-controls { display: flex; align-items: center; gap: 8px; }
      .month-bar .fech-status { font-size: .82rem; }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-inner">
        <div class="page-header-label">Ferramentas Escolares</div>
        <h1>Fluxo de Caixa</h1>
        <p>Registre entradas e saídas, acompanhe o saldo corrente e feche os meses conferidos.</p>
      </div>
    </header>
    <div class="page-body">

    <!-- ===== Seletor de mês + fechamento ===== -->
    <div class="month-bar">
      <div class="month-nav">
        <button type="button" class="ghost" onclick="changeMonth(-1)" title="Mês anterior">◀</button>
        <input id="gMes" type="text" placeholder="mm/aaaa" maxlength="7"
               onchange="onMonthChange()"
               oninput="onMonthInput()"
               onkeydown="if(event.key==='Enter'){event.preventDefault();onMonthChange();}" />
        <button type="button" class="ghost" onclick="changeMonth(1)" title="Próximo mês">▶</button>
      </div>
      <div class="fech-controls">
        <span id="fechStatus" class="fech-status"></span>
        <button id="fechToggle" class="secondary" onclick="toggleFechamento()" style="display:none;"></button>
      </div>
    </div>

    <!-- ===== Saldo ===== -->
    <div class="card">
      <h2>Saldo do mês</h2>
      <div id="saldoNum" class="saldo-num">—</div>
      <div id="saldoTotais" class="totais muted"></div>
      <div id="saldoWarn"></div>
    </div>

    <!-- ===== Lançamento (criar/editar) ===== -->
    <div class="card">
      <h2 id="lancTitulo">Novo lançamento</h2>
      <div class="row">
        <div style="min-width:130px;">
          <label for="lTipo">Tipo</label>
          <select id="lTipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </div>
        <div style="min-width:150px;">
          <label for="lData">Data</label>
          <input id="lData" type="date" />
        </div>
        <div style="min-width:130px;">
          <label for="lValor">Valor (R$)</label>
          <input id="lValor" inputmode="decimal" placeholder="Ex.: 200,00" />
        </div>
        <div class="grow">
          <label for="lCategoria">Categoria</label>
          <input id="lCategoria" list="catList" placeholder="Ex.: Doação" maxlength="60" />
          <datalist id="catList"></datalist>
        </div>
      </div>
      <div class="field" style="margin-top:8px;">
        <label for="lDescricao">Descrição</label>
        <textarea id="lDescricao" maxlength="280" placeholder="Descrição do lançamento"></textarea>
      </div>
      <div class="row" style="margin-top:4px;">
        <button id="lSalvar" onclick="submitLancamento()">Adicionar</button>
        <button id="lCancelar" class="ghost hidden" onclick="resetLancamentoForm()">Cancelar edição</button>
      </div>
      <div id="lResult"></div>
    </div>

    <!-- ===== Lista + filtros ===== -->
    <div class="card">
      <h2>Lançamentos</h2>
      <div class="row">
        <div style="min-width:140px;">
          <label for="fTipo">Tipo</label>
          <select id="fTipo">
            <option value="">Todos</option>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </div>
        <div class="grow">
          <label for="fCategoria">Categoria</label>
          <input id="fCategoria" list="catList" placeholder="Qualquer categoria" />
        </div>
        <div>
          <button class="secondary" onclick="loadLancamentos()">Filtrar</button>
          <button class="ghost" onclick="limparFiltro()">Limpar</button>
        </div>
      </div>
      <div id="listResult"></div>
      <table id="listTable" class="hidden">
        <thead>
          <tr><th>Data</th><th>Tipo</th><th>Categoria</th><th class="num">Valor</th><th>Descrição</th><th>Ações</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- ===== Modal: Saldo de abertura ===== -->
    <div id="abModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeAbModal()">
      <div class="modal" role="dialog" aria-labelledby="abModalTitle">
        <h2 id="abModalTitle">Saldo de abertura</h2>
        <p class="muted" style="margin-top:0;">Aceita valor ≥ 0 e data não-futura.</p>
        <div class="field">
          <label for="abValor">Valor de abertura (R$)</label>
          <input id="abValor" inputmode="decimal" placeholder="Ex.: 1.000,00" />
        </div>
        <div class="field">
          <label for="abData">Data de abertura (dd/mm/aaaa)</label>
          <input id="abData" type="text" placeholder="dd/mm/aaaa" maxlength="10" />
        </div>
        <div id="abResult"></div>
        <div class="modal-footer">
          <button class="ghost" onclick="closeAbModal()">Cancelar</button>
          <button id="abRemover" class="danger hidden" onclick="removeAbertura()">Remover</button>
          <button id="abBtn" onclick="saveAbertura()">Registrar</button>
        </div>
      </div>
    </div>

    <script>
      // ---- formatação / helpers ----
      var BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
      function el(id){ return document.getElementById(id); }
      function fmtBRL(v){ return BRL.format(Number(v) || 0); }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
      function show(id,on){ el(id).classList.toggle('hidden', !on); }
      function box(id,msg,cls){ el(id).innerHTML = msg ? '<div class="result '+cls+'">'+msg+'</div>' : ''; }

      // Gerador de UUID (idempotência): crypto.randomUUID com fallback.
      function uuid(){
        if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
          var r = (Math.random()*16)|0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      // Date (do servidor) → 'yyyy-MM-dd' para o <input type=date>.
      function dateToInput(d){
        if (!d) return '';
        // Já no formato ISO yyyy-MM-dd (vindo do servidor serializado): usar direto.
        if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
        var dt = (d instanceof Date) ? d : new Date(d);
        if (isNaN(dt.getTime())) return '';
        var mm = String(dt.getMonth()+1).padStart(2,'0');
        var dd = String(dt.getDate()).padStart(2,'0');
        return dt.getFullYear()+'-'+mm+'-'+dd;
      }
      // Date (do servidor) → 'dd/MM/yyyy' para exibir.
      function dateToBR(d){
        var iso = dateToInput(d);
        if (!iso) return '';
        var p = iso.split('-');
        return p[2]+'/'+p[1]+'/'+p[0];
      }
      // Converte 'mm/aaaa' (input BR) → 'YYYY-MM' (chave do servidor).
      function mesBRtoKey(v){
        if (!v) return '';
        var p = String(v).split('/');
        if (p.length !== 2) return '';
        return p[1]+'-'+p[0];
      }

      // ---- estado da UI ----
      var editId = null;          // id do lançamento em edição (null = criação)
      var clientToken = uuid();   // token de idempotência da criação atual
      var selectedMonth = '';     // YYYY-MM do mês selecionado
      var closedSet = {};         // set de períodos fechados (chave YYYY-MM)

      // ===== Mês global =====
      function todayMonthBR(){
        var d = new Date();
        return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
      }
      function keyToMonthBR(k){
        var p = String(k).split('-');
        return (p.length === 2) ? (p[1]+'/'+p[0]) : k;
      }
      function initMonth(){
        el('gMes').value = todayMonthBR();
        selectedMonth = mesBRtoKey(el('gMes').value);
      }
      function onMonthChange(){
        var k = mesBRtoKey(el('gMes').value);
        if (!k) return;
        if (k === selectedMonth) return;   // nada mudou
        selectedMonth = k;
        refreshAll();
      }
      function onMonthInput(){
        var v = el('gMes').value;
        if (/^\d{2}\/\d{4}$/.test(v)) onMonthChange();
      }
      function changeMonth(delta){
        var k = selectedMonth || mesBRtoKey(el('gMes').value);
        if (!k) return;
        var p = k.split('-');
        var y = parseInt(p[0],10), m = parseInt(p[1],10) + delta;
        if (m < 1){ m = 12; y--; }
        if (m > 12){ m = 1; y++; }
        selectedMonth = y+'-'+String(m).padStart(2,'0');
        el('gMes').value = keyToMonthBR(selectedMonth);
        refreshAll();
      }
      // Pula o seletor para o mês de uma data 'dd/MM/yyyy' (ex.: após gravar).
      function goToMonthOfBR(dataBR){
        var p = String(dataBR || '').split('/');
        if (p.length !== 3) return false;
        var k = p[2]+'-'+p[1];
        if (k === selectedMonth) return false;
        selectedMonth = k;
        el('gMes').value = keyToMonthBR(k);
        return true;
      }
      function refreshAll(){
        google.script.run
          .withSuccessHandler(function(d){
            renderMonthState(d.monthState);
            renderLista(d.lancamentos);
            renderCategorias(d.categorias);
            applyClosedPeriods(d.closedPeriods);
          })
          .withFailureHandler(function(e){ box('saldoWarn', esc(e.message), 'err'); })
          .getDashboard(currentFiltro(), selectedMonth);
      }

      // ===== Saldo (mês selecionado) =====
      function loadMonthState(){
        google.script.run
          .withSuccessHandler(renderMonthState)
          .withFailureHandler(function(e){ box('saldoWarn', esc(e.message), 'err'); })
          .getMonthState(selectedMonth);
      }
      function renderMonthState(s){
        var neg = Number(s.saldoFinal) < 0;
        el('saldoNum').textContent = fmtBRL(s.saldoFinal);
        el('saldoNum').classList.toggle('neg', neg);
        var defined = !!s.aberturaDefinida;
        var abHtml = 'Abertura do mês: <b>'+fmtBRL(s.saldoInicio)+'</b>';
        abHtml += ' <button class="edit-pen" title="Editar saldo de abertura global" onclick="openAbModal()">✏️</button>';
        el('saldoTotais').innerHTML =
          '<div>'+abHtml+'</div>'+
          '<div>Entradas: <b>'+fmtBRL(s.totalEntradas)+'</b></div>'+
          '<div>Saídas: <b>'+fmtBRL(s.totalSaidas)+'</b></div>';
        var w = '';
        if (!defined) w += '<div class="warn">⚠️ Saldo de abertura global não definido — tratado como R$ 0,00. <a href="#" onclick="openAbModal();return false;" style="font-weight:700;">Registrar agora</a>.</div>';
        if (neg) w += '<div class="warn">⚠️ Saldo negativo.</div>';
        el('saldoWarn').innerHTML = w;
      }

      // ===== Abertura (modal) =====
      var abDefined = false;  // tracks whether opening balance is set
      function openAbModal(){
        box('abResult','','');
        el('abValor').value = '';
        el('abData').value = '';
        el('abValor').disabled = false;
        el('abData').disabled = false;
        el('abBtn').disabled = false;
        show('abRemover', false);
        el('abModalTitle').textContent = 'Saldo de abertura';
        el('abBtn').textContent = 'Registrar';
        show('abModal', true);
        // Pre-fill if editing
        google.script.run
          .withSuccessHandler(function(ob){
            abDefined = ob.definida;
            if (ob.definida) {
              el('abValor').value = String(ob.valor).replace('.', ',');
              // ob.data já vem dd/mm/aaaa do servidor
              if (ob.data) el('abData').value = ob.data;
              el('abBtn').textContent = 'Salvar';
              el('abModalTitle').textContent = 'Editar saldo de abertura';
              show('abRemover', true);
            }
          })
          .withFailureHandler(function(){})
          .getOpeningBalance();
      }
      function closeAbModal(){ show('abModal', false); }
      function saveAbertura(){
        var btn = el('abBtn');
        btn.disabled = true;
        var opts = { valor: el('abValor').value, data: el('abData').value };  // já em dd/mm/aaaa
        var fn = abDefined ? 'updateOpeningBalance' : 'setOpeningBalance';
        google.script.run
          .withSuccessHandler(function(){
            box('abResult','✅ Saldo de abertura '+(abDefined?'atualizado':'registrado')+'.','ok');
            setTimeout(function(){ closeAbModal(); loadMonthState(); }, 800);
          })
          .withFailureHandler(function(e){ btn.disabled = false; box('abResult','❌ '+esc(e.message),'err'); })
          [fn](opts);
      }
      function removeAbertura(){
        if (!confirm('Remover o saldo de abertura? O valor voltará a ser tratado como R$ 0,00.')) return;
        el('abRemover').disabled = true;
        google.script.run
          .withSuccessHandler(function(){
            box('abResult','✅ Saldo de abertura removido.','ok');
            setTimeout(function(){ closeAbModal(); loadMonthState(); }, 800);
          })
          .withFailureHandler(function(e){ el('abRemover').disabled = false; box('abResult','❌ '+esc(e.message),'err'); })
          .clearOpeningBalance();
      }
      // ESC to close modal
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !el('abModal').classList.contains('hidden')) closeAbModal(); });

      // ===== Categorias (autocomplete) =====
      function renderCategorias(cats){
        el('catList').innerHTML = (cats || []).map(function(c){ return '<option value="'+esc(c)+'"></option>'; }).join('');
      }
      function loadCategorias(){
        google.script.run
          .withSuccessHandler(renderCategorias)
          .withFailureHandler(function(){ /* autocomplete é opcional */ })
          .listCategorias();
      }

      // ===== Lançamento (criar/editar) =====
      var VALOR_TETO = 1000000;   // teto técnico (R$ 1.000.000,00) — acima exige confirmação na UI.
      // Espelha parseMoney_ do servidor o suficiente para a checagem de teto.
      function parseValorBR(raw){
        if (raw == null) return NaN;
        var s = String(raw).trim();
        if (s === '') return NaN;
        if (s.indexOf(',') !== -1) {
          s = s.replace(/\./g, '').replace(',', '.');
        } else if ((s.split('.').length - 1) > 1) {
          s = s.replace(/\./g, '');
        }
        var n = Number(s);
        return isFinite(n) ? n : NaN;
      }
      // Converte 'yyyy-MM-dd' (input date) → 'dd/MM/yyyy' (servidor).
      function inputDateToBR(v){
        if (!v) return '';
        var p = v.split('-');
        return p[2]+'/'+p[1]+'/'+p[0];
      }
      function buildItem(){
        return {
          tipo: el('lTipo').value,
          data: inputDateToBR(el('lData').value),
          valor: el('lValor').value,
          categoria: el('lCategoria').value,
          descricao: el('lDescricao').value
        };
      }
      function submitLancamento(){
        var btn = el('lSalvar');
        var item = buildItem();
        // Teto técnico: exige confirmação explícita antes de gravar (LANC, anti fat-finger).
        var n = parseValorBR(item.valor);
        if (isFinite(n) && n > VALOR_TETO &&
            !confirm('O valor informado (' + fmtBRL(n) + ') excede R$ 1.000.000,00. Confirma o registro deste valor?')) {
          return; // usuário cancelou — não grava, botão segue habilitado
        }
        btn.disabled = true;                 // anti-duplo-clique (complementa idempotência do servidor)
        if (editId) {
          google.script.run
            .withSuccessHandler(function(){ btn.disabled = false; box('lResult','✅ Lançamento atualizado.','ok'); goToMonthOfBR(item.data); resetLancamentoForm(); afterWrite(); })
            .withFailureHandler(function(e){ btn.disabled = false; box('lResult','❌ '+esc(e.message),'err'); })
            .editLancamento(editId, item);
        } else {
          google.script.run
            .withSuccessHandler(function(){
              btn.disabled = false;
              clientToken = uuid();          // rotaciona o token após sucesso
              box('lResult','✅ Lançamento adicionado.','ok');
              el('lValor').value = ''; el('lDescricao').value = '';
              goToMonthOfBR(item.data);      // garante que o novo lançamento fique visível
              afterWrite();
            })
            .withFailureHandler(function(e){ btn.disabled = false; box('lResult','❌ '+esc(e.message),'err'); })
            .addLancamento(item, clientToken); // mesmo token em retry → dedupe
        }
      }
      function startEdit(r){
        editId = r.Id;
        clientToken = uuid();
        el('lancTitulo').textContent = 'Editar lançamento';
        el('lTipo').value = r.Tipo;
        el('lData').value = dateToInput(r.Data);    // yyyy-MM-dd (native date input)
        el('lValor').value = String(r.Valor).replace('.', ',');
        el('lCategoria').value = r.Categoria || '';
        el('lDescricao').value = r.Descricao || '';
        el('lSalvar').textContent = 'Salvar alterações';
        show('lCancelar', true);
        box('lResult', '', '');
        el('lancTitulo').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      function resetLancamentoForm(){
        editId = null;
        clientToken = uuid();                // novo token a cada abertura do formulário
        el('lancTitulo').textContent = 'Novo lançamento';
        el('lSalvar').textContent = 'Adicionar';
        el('lValor').value = ''; el('lCategoria').value = ''; el('lDescricao').value = '';
        el('lTipo').value = 'entrada';
        show('lCancelar', false);
      }
      function afterWrite(){ refreshAll(); }

      // ===== Lista + filtros =====
      function currentFiltro(){
        return {
          mes: selectedMonth,                // mês global
          tipo: el('fTipo').value || '',
          categoria: el('fCategoria').value || ''
        };
      }
      function limparFiltro(){
        el('fTipo').value = ''; el('fCategoria').value = '';
        loadLancamentos();
      }
      function loadLancamentos(){
        google.script.run
          .withSuccessHandler(renderLista)
          .withFailureHandler(function(e){ show('listTable', false); box('listResult', esc(e.message), 'err'); })
          .listLancamentos(currentFiltro());
      }
      var ROWS = {};
      function renderLista(rows){
        ROWS = {};
        if (!rows || !rows.length){
          show('listTable', false);
          box('listResult', 'Nenhum lançamento para os filtros atuais.', 'ok');
          return;
        }
        box('listResult', '', '');
        show('listTable', true);
        el('listTable').querySelector('tbody').innerHTML = rows.map(function(r){
          ROWS[r.Id] = r;
          return '<tr>'+
            '<td>'+esc(dateToBR(r.Data))+'</td>'+
            '<td><span class="tag '+esc(r.Tipo)+'">'+esc(r.Tipo)+'</span></td>'+
            '<td>'+esc(r.Categoria)+'</td>'+
            '<td class="num">'+fmtBRL(r.Valor)+'</td>'+
            '<td>'+esc(r.Descricao)+'</td>'+
            '<td class="actions">'+
              '<button class="ghost" onclick="onEdit(\''+esc(r.Id)+'\')">editar</button>'+
              '<button class="danger" onclick="onDelete(\''+esc(r.Id)+'\')">excluir</button>'+
            '</td></tr>';
        }).join('');
      }
      function onEdit(id){ if (ROWS[id]) startEdit(ROWS[id]); }
      function onDelete(id){
        if (!window.confirm('Excluir este lançamento? (exclusão lógica, auditada)')) return;
        google.script.run
          .withSuccessHandler(function(){ box('listResult','✅ Lançamento excluído.','ok'); afterWrite(); })
          .withFailureHandler(function(e){ box('listResult','❌ '+esc(e.message),'err'); })
          .deleteLancamento(id);
      }

      // ===== Fechamento (inline no seletor de mês) =====
      function applyClosedPeriods(list){
        closedSet = {};
        (list || []).forEach(function(p){ closedSet[p.periodo] = p; });
        renderFechamentoStatus();
      }
      function loadFechamentoStatus(){
        google.script.run
          .withSuccessHandler(applyClosedPeriods)
          .withFailureHandler(function(){})
          .listClosedPeriods();
      }
      function renderFechamentoStatus(){
        var info = closedSet[selectedMonth];
        var btn = el('fechToggle');
        if (info) {
          el('fechStatus').innerHTML = '<span class="pill">fechado</span>';
          btn.textContent = 'Reabrir';
          btn.className = 'secondary';
          btn.style.display = '';
        } else {
          el('fechStatus').innerHTML = '<span class="pill" style="background:#e6f4ea;color:#137333;">aberto</span>';
          btn.textContent = 'Fechar mês';
          btn.className = '';
          btn.style.display = '';
        }
      }
      function toggleFechamento(){
        var info = closedSet[selectedMonth];
        var btn = el('fechToggle');
        btn.disabled = true;
        if (info) {
          google.script.run
            .withSuccessHandler(function(){ btn.disabled = false; refreshAll(); })
            .withFailureHandler(function(e){ btn.disabled = false; alert('❌ '+e.message); })
            .reopenMonth(selectedMonth);
        } else {
          google.script.run
            .withSuccessHandler(function(){ btn.disabled = false; refreshAll(); })
            .withFailureHandler(function(e){ btn.disabled = false; alert('❌ '+e.message); })
            .closeMonth(selectedMonth);
        }
      }

      // ===== bootstrap =====
      resetLancamentoForm();
      initMonth();
      refreshAll();
    </script>
  </div><!-- /.page-body -->
  </body>
</html>
