name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'cash-flow/**'
      - 'book-registration/**'
      - 'comp-time/**'
      - 'portal/**'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to deploy'
        required: true
        type: choice
        options:
          - cash-flow
          - book-registration
          - comp-time
          - portal
          - all

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cash-flow: ${{ steps.set-outputs.outputs.cash-flow }}
      book-registration: ${{ steps.set-outputs.outputs.book-registration }}
      comp-time: ${{ steps.set-outputs.outputs.comp-time }}
      portal: ${{ steps.set-outputs.outputs.portal }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            cash-flow:
              - 'cash-flow/**'
            book-registration:
              - 'book-registration/**'
            comp-time:
              - 'comp-time/**'
            portal:
              - 'portal/**'

      - name: Set outputs
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ github.event.inputs.project }}"
            if [ "$PROJECT" = "all" ] || [ "$PROJECT" = "cash-flow" ]; then
              echo "cash-flow=true" >> "$GITHUB_OUTPUT"
            else
              echo "cash-flow=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$PROJECT" = "all" ] || [ "$PROJECT" = "book-registration" ]; then
              echo "book-registration=true" >> "$GITHUB_OUTPUT"
            else
              echo "book-registration=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$PROJECT" = "all" ] || [ "$PROJECT" = "comp-time" ]; then
              echo "comp-time=true" >> "$GITHUB_OUTPUT"
            else
              echo "comp-time=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$PROJECT" = "all" ] || [ "$PROJECT" = "portal" ]; then
              echo "portal=true" >> "$GITHUB_OUTPUT"
            else
              echo "portal=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "cash-flow=${{ steps.filter.outputs.cash-flow }}" >> "$GITHUB_OUTPUT"
            echo "book-registration=${{ steps.filter.outputs.book-registration }}" >> "$GITHUB_OUTPUT"
            echo "comp-time=${{ steps.filter.outputs.comp-time }}" >> "$GITHUB_OUTPUT"
            echo "portal=${{ steps.filter.outputs.portal }}" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.cash-flow == 'true' ||
      needs.detect-changes.outputs.book-registration == 'true' ||
      needs.detect-changes.outputs.comp-time == 'true' ||
      needs.detect-changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # New semver when meaningful commits exist; otherwise keep the current tag.
      version: ${{ steps.tag.outputs.new_version || steps.tag.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute semver and create tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No implicit bump: only feat/fix/BREAKING create a new tag; trivial
          # deploys (docs/chore) keep the previous version (VER-07).
          default_bump: false
      - name: Summary
        run: |
          echo "### version" >> "$GITHUB_STEP_SUMMARY"
          echo "computed: ${{ steps.tag.outputs.new_version || steps.tag.outputs.previous_version || 'dev' }}" >> "$GITHUB_STEP_SUMMARY"

  test-cash-flow:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.cash-flow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cash-flow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  deploy-cash-flow:
    needs: [detect-changes, test-cash-flow, version]
    if: >-
      !failure() &&
      needs.detect-changes.outputs.cash-flow == 'true'
    runs-on: ubuntu-latest
    outputs:
      webapp-url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - name: Authenticate clasp
        env:
          CLASP_AUTH: ${{ secrets.CLASP_AUTH }}
        run: echo "$CLASP_AUTH" > ~/.clasprc.json
      - name: Create clasp project config
        env:
          SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID_CASH_FLOW }}
        working-directory: cash-flow
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${SCRIPT_ID}",
            "rootDir": "",
            "scriptExtensions": [".js", ".gs"]
          }
          EOF
      - name: Inject app version
        working-directory: cash-flow
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            sed -i "s|var APP_VERSION = '__APP_VERSION__'|var APP_VERSION = '${VERSION}'|" Index.html
          fi
      - name: Push to Apps Script
        working-directory: cash-flow
        run: clasp push --force
      - name: Update versioned deployment
        id: deploy
        working-directory: cash-flow
        run: |
          DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          if [ -z "$DEPLOY_ID" ]; then
            clasp deploy
            DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          else
            clasp deploy -i "$DEPLOY_ID"
          fi
          echo "### cash-flow" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOY_ID" ]; then
            URL="https://script.google.com/macros/s/${DEPLOY_ID}/exec"
            echo "webapp-url=${URL}" >> "$GITHUB_OUTPUT"
            echo "${URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No versioned deployment found._" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-book-registration:
    needs: [detect-changes, version]
    if: needs.detect-changes.outputs.book-registration == 'true'
    runs-on: ubuntu-latest
    outputs:
      webapp-url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - name: Authenticate clasp
        env:
          CLASP_AUTH: ${{ secrets.CLASP_AUTH }}
        run: echo "$CLASP_AUTH" > ~/.clasprc.json
      - name: Create clasp project config
        env:
          SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID_BOOK_REGISTRATION }}
        working-directory: book-registration
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${SCRIPT_ID}",
            "rootDir": ""
          }
          EOF
      - name: Inject app version
        working-directory: book-registration
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            sed -i "s|var APP_VERSION = '__APP_VERSION__'|var APP_VERSION = '${VERSION}'|" Index.html
          fi
      - name: Push to Apps Script
        working-directory: book-registration
        run: clasp push --force
      - name: Update versioned deployment
        id: deploy
        working-directory: book-registration
        run: |
          DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          if [ -z "$DEPLOY_ID" ]; then
            clasp deploy
            DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          else
            clasp deploy -i "$DEPLOY_ID"
          fi
          echo "### book-registration" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOY_ID" ]; then
            URL="https://script.google.com/macros/s/${DEPLOY_ID}/exec"
            echo "webapp-url=${URL}" >> "$GITHUB_OUTPUT"
            echo "${URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No versioned deployment found._" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-comp-time:
    needs: [detect-changes, version]
    if: needs.detect-changes.outputs.comp-time == 'true'
    runs-on: ubuntu-latest
    outputs:
      webapp-url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - name: Authenticate clasp
        env:
          CLASP_AUTH: ${{ secrets.CLASP_AUTH }}
        run: echo "$CLASP_AUTH" > ~/.clasprc.json
      - name: Create clasp project config
        env:
          SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID_COMP_TIME }}
        working-directory: comp-time
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${SCRIPT_ID}",
            "rootDir": ""
          }
          EOF
      - name: Inject app version
        working-directory: comp-time
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            sed -i "s|var APP_VERSION = '__APP_VERSION__'|var APP_VERSION = '${VERSION}'|" Index.html
          fi
      - name: Push to Apps Script
        working-directory: comp-time
        run: clasp push --force
      - name: Update versioned deployment
        id: deploy
        working-directory: comp-time
        run: |
          DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          if [ -z "$DEPLOY_ID" ]; then
            clasp deploy
            DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          else
            clasp deploy -i "$DEPLOY_ID"
          fi
          echo "### comp-time" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOY_ID" ]; then
            URL="https://script.google.com/macros/s/${DEPLOY_ID}/exec"
            echo "webapp-url=${URL}" >> "$GITHUB_OUTPUT"
            echo "${URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No versioned deployment found._" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-portal:
    needs:
      - detect-changes
      - version
      - deploy-cash-flow
      - deploy-book-registration
      - deploy-comp-time
    if: >-
      !cancelled() && !failure() &&
      (needs.detect-changes.outputs.portal == 'true' ||
       needs.detect-changes.outputs.cash-flow == 'true' ||
       needs.detect-changes.outputs.book-registration == 'true' ||
       needs.detect-changes.outputs.comp-time == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - name: Authenticate clasp
        env:
          CLASP_AUTH: ${{ secrets.CLASP_AUTH }}
        run: echo "$CLASP_AUTH" > ~/.clasprc.json
      - name: Inject config into portal files
        working-directory: portal
        env:
          # Prefer the URL produced by the upstream deploy job in this run;
          # fall back to the stable repository variable when that app was
          # not part of this run (its deploy job was skipped).
          URL_CASH_FLOW: ${{ needs.deploy-cash-flow.outputs.webapp-url || vars.WEBAPP_URL_CASH_FLOW }}
          URL_COMP_TIME: ${{ needs.deploy-comp-time.outputs.webapp-url || vars.WEBAPP_URL_COMP_TIME }}
          URL_BOOK_REGISTRATION: ${{ needs.deploy-book-registration.outputs.webapp-url || vars.WEBAPP_URL_BOOK_REGISTRATION }}
          ALLOWED_EMAILS: ${{ vars.PORTAL_ALLOWED_EMAILS }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$URL_CASH_FLOW" ]; then
            sed -i "s|REPLACE_WITH_CASHFLOW_WEBAPP_URL|${URL_CASH_FLOW}|g" Index.html
          fi
          if [ -n "$URL_COMP_TIME" ]; then
            sed -i "s|REPLACE_WITH_COMPTIME_WEBAPP_URL|${URL_COMP_TIME}|g" Index.html
          fi
          if [ -n "$URL_BOOK_REGISTRATION" ]; then
            sed -i "s|REPLACE_WITH_LIBRARY_WEBAPP_URL|${URL_BOOK_REGISTRATION}|g" Index.html
          fi
          if [ -n "$VERSION" ]; then
            sed -i "s|var APP_VERSION = '__APP_VERSION__'|var APP_VERSION = '${VERSION}'|" Index.html
          fi
          sed -i "s|REPLACE_WITH_ALLOWED_EMAILS|${ALLOWED_EMAILS}|g" Code.gs
      - name: Create clasp project config
        env:
          SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID_PORTAL }}
        working-directory: portal
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${SCRIPT_ID}",
            "rootDir": ""
          }
          EOF
      - name: Push to Apps Script
        working-directory: portal
        run: clasp push --force
      - name: Update versioned deployment
        working-directory: portal
        run: |
          DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          if [ -z "$DEPLOY_ID" ]; then
            clasp deploy
            DEPLOY_ID=$(clasp deployments | grep -v '@HEAD' | grep '^- ' | tail -1 | awk '{print $2}')
          else
            clasp deploy -i "$DEPLOY_ID"
          fi
          echo "### portal" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOY_ID" ]; then
            echo "https://script.google.com/macros/s/${DEPLOY_ID}/exec" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No versioned deployment found._" >> "$GITHUB_STEP_SUMMARY"
          fi
